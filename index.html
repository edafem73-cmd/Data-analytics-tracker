<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataPath Analytics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f1b2d'/><path d='M7 22l6-7 5 4 7-9' fill='none' stroke='%232dd4bf' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="landing"></div>
<aside id="sidebar" aria-label="Main navigation">
  <div class="brand"><svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="7" fill="#1e3a5f"/><path d="M7 22l6-7 5 4 7-9" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/></svg><span>DataPath Analytics</span></div>
  <nav id="nav"></nav>
  <button class="nav-link" data-act="theme" id="theme-btn"></button>
</aside>
<div id="scrim" data-act="menu"></div>
<div id="shell">
  <header id="topbar">
    <button class="icon-btn" data-act="menu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <h1 id="page-title">Dashboard</h1>
    <span id="today-label"></span>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg"><div id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script src="script.js"></script>
</body>
</html>
